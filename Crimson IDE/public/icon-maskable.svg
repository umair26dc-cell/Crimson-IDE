<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <!-- Full-bleed background for maskable adaptive icon -->
  <rect width="512" height="512" fill="#090a0f"/>
  
  <!-- Subtle circular brand glow within safe zone -->
  <radialGradient id="maskableGlow" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#f43f5e" stop-opacity="0.35"/>
    <stop offset="100%" stop-color="#090a0f" stop-opacity="0"/>
  </radialGradient>
  <circle cx="256" cy="256" r="180" fill="url(#maskableGlow)"/>

  <!-- Centered logo inside safe zone (320x320 centered at 256, 256) -->
  <g transform="translate(96, 96) scale(2.5)">
    <defs>
      <linearGradient id="mBladeFront" x1="24" y1="20" x2="104" y2="108" gradientUnits="userSpaceOnUse">
        <stop offset="0%" stop-color="#ff4b72"/>
        <stop offset="45%" stop-color="#e11d48"/>
        <stop offset="100%" stop-color="#9f1239"/>
      </linearGradient>
      <linearGradient id="mWingTop" x1="30" y1="18" x2="98" y2="48" gradientUnits="userSpaceOnUse">
        <stop offset="0%" stop-color="#fda4af"/>
        <stop offset="40%" stop-color="#f43f5e"/>
        <stop offset="100%" stop-color="#be123c"/>
      </linearGradient>
      <linearGradient id="mWingBottom" x1="30" y1="110" x2="98" y2="80" gradientUnits="userSpaceOnUse">
        <stop offset="0%" stop-color="#fda4af"/>
        <stop offset="50%" stop-color="#f43f5e"/>
        <stop offset="100%" stop-color="#9f1239"/>
      </linearGradient>
      <linearGradient id="mFoldShadow" x1="20" y1="40" x2="64" y2="88" gradientUnits="userSpaceOnUse">
        <stop offset="0%" stop-color="#4c0519"/>
        <stop offset="60%" stop-color="#881337"/>
        <stop offset="100%" stop-color="#be123c"/>
      </linearGradient>
      <linearGradient id="mBackSpine" x1="94" y1="26" x2="94" y2="102" gradientUnits="userSpaceOnUse">
        <stop offset="0%" stop-color="#be123c"/>
        <stop offset="50%" stop-color="#881337"/>
        <stop offset="100%" stop-color="#4c0519"/>
      </linearGradient>
    </defs>

    <g>
      <path d="M86 28 L98 38 L98 90 L86 100 L76 86 L84 78 L84 50 L76 42 Z" fill="url(#mBackSpine)"/>
      <path d="M28 88 L52 108 L86 100 L68 84 L46 88 Z" fill="url(#mFoldShadow)"/>
      <path d="M24 78 L68 112 L98 90 L76 74 L48 94 L38 86 Z" fill="url(#mWingBottom)"/>
      <path d="M28 40 L46 40 L68 44 L86 28 L52 20 Z" fill="url(#mFoldShadow)"/>
      <path d="M24 50 L38 42 L48 34 L76 54 L98 38 L68 16 Z" fill="url(#mWingTop)"/>
      <path d="M24 50 L42 64 L24 78 L18 64 Z" fill="#ff4b72"/>
      <path d="M24 50 L76 14 L96 28 L42 78 L24 78 Z" fill="url(#mBladeFront)"/>
      <path d="M24 78 L76 114 L96 100 L42 50 L24 50 Z" fill="url(#mBladeFront)" opacity="0.92"/>
      <path d="M28 64 L54 44 L54 84 Z" fill="#090a0f" opacity="0.9"/>
